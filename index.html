<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My 3D Viewer — v0.7</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Inter,Arial,sans-serif}
#viewer{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff}
#ui>*{position:absolute}
.panel{background:rgba(20,20,24,.78);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
button,.file-label,select{border:0;color:#fff;background:#2a2a31;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit}
button:hover,.file-label:hover{background:#3a3a44}
button.on{background:#fff;color:#111}
input[type=file]{display:none}
input[type=range]{accent-color:#fff}
#topbar{left:18px;top:18px;display:flex;gap:8px;align-items:center;pointer-events:auto;flex-wrap:wrap;right:300px}
#topbar>*{margin:0}
#settings{left:18px;top:74px;width:250px;padding:14px;pointer-events:auto;display:none;max-height:calc(100% - 150px);overflow:auto}
#settings label{display:block;font-size:12px;color:#bbb;margin:10px 0 4px}
#settings select{width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row button{flex:1;padding:8px 6px;font-size:13px}
#animations{right:18px;top:18px;width:250px;padding:14px;pointer-events:auto;display:none}
#animations h3{margin:0 0 10px;font-size:14px}
#animationList{display:flex;flex-direction:column;gap:7px;max-height:45vh;overflow:auto}
.anim{width:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anim.active{background:#fff;color:#111}
#dock{left:50%;bottom:58px;transform:translateX(-50%);width:min(620px,calc(100% - 36px));padding:10px 12px;pointer-events:auto;display:none;align-items:center;gap:10px}
#timeline{flex:1;min-width:0}
#dock select{padding:8px 6px}
#time{font-size:12px;color:#ccc;min-width:78px;text-align:right;font-variant-numeric:tabular-nums}
#hint{left:50%;bottom:18px;transform:translateX(-50%);padding:9px 13px;font-size:12px;color:#ddd;white-space:nowrap}
#status{left:18px;bottom:18px;padding:8px 11px;font-size:12px;color:#ccc;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#drop{inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);opacity:0;visibility:hidden;transition:.15s;z-index:10}
#drop.show{opacity:1;visibility:visible}
.dropbox{padding:30px 40px;text-align:center;font-size:18px}
@media(max-width:700px){#animations{left:18px;right:18px;top:auto;bottom:112px;width:auto}#hint{display:none}#topbar{right:18px}#status{max-width:calc(100% - 36px);bottom:12px}#dock{bottom:54px}}
#left{left:18px;top:18px;width:270px;max-height:calc(100% - 110px);overflow:auto;display:flex;flex-direction:column;gap:8px;pointer-events:none;padding-top:44px}
#left>*{pointer-events:auto;flex-shrink:0}
#left #topbar,#left #settings,#left #animations{position:static;width:auto;right:auto;left:auto;top:auto;max-height:none}
#left #topbar{padding:0}
#paths{padding:14px}
.pill{position:absolute;pointer-events:auto;opacity:.5;padding:8px 11px}
.pill:hover{opacity:1}
#pillL{left:18px;top:18px}#pillE{left:66px;top:18px}
#pillD{right:18px;bottom:58px;display:none}
.krow{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:#bbb}
.krow input{width:58px;background:#2a2a31;color:#fff;border:0;border-radius:8px;padding:7px}
.krow .go{flex:1;text-align:left}
.krow button{padding:7px 9px}
body.noL #left{display:none}
body.noD #dock{display:none!important}
body.clean #ui>*:not(#pillE){display:none!important}
body.clean #pillE{opacity:.15}
svg.ic{width:1.15em;height:1.15em;vertical-align:-0.22em;flex-shrink:0;pointer-events:none}
</style>
</head>
<body>
<div id="viewer"></div>
<div id="ui">
  <div id="left"><div id="topbar">
    <div class="panel" style="padding:6px"><label class="file-label" for="file"><i data-ic="cube"></i> Открыть GLB</label><input id="file" type="file" accept=".glb,.gltf,.json" multiple></div>
    <button id="reset" class="panel"><i data-ic="refresh"></i> Камера</button>
    <button id="settingsBtn" class="panel"><i data-ic="tune"></i> Вид</button>
    <button id="fs" class="panel" title="Полный экран"><i data-ic="full"></i></button>
  </div>

  <div id="settings" class="panel">
    <label>Освещение</label>
    <select id="light"><option value="studio">Студия (HDRI)</option><option value="sun">Экстерьер: солнце и небо</option><option value="real">Реализм (мягкие тени)</option><option value="classic">Классика</option></select>
    <div id="sunCtl" style="display:none">
      <label>Погода</label><select id="weather"><option value="clear">Ясно</option><option value="few">Лёгкая облачность</option><option value="partly">Переменная облачность</option><option value="overcast">Пасмурно</option><option value="fog">Туман / дымка</option></select>
      <label>Время суток: <b id="clockTxt">15:00</b></label><input id="tod" type="range" min="0" max="24" step="0.05" value="15" style="width:100%">
      <label>Направление солнца</label><input id="az" type="range" min="0" max="360" step="1" value="200" style="width:100%">
      <label>Облачность (тонкая настройка)</label><input id="cloud" type="range" min="0" max="1" step="0.01" value="0.35" style="width:100%">
      <div class="row" style="margin-top:8px"><button id="timePlay"><i data-ic="play"></i> Ход времени</button><select id="timeSpeed"><option value="0.25">0.25 ч/с</option><option value="0.5">0.5 ч/с</option><option value="1" selected>1 ч/с</option><option value="2">2 ч/с</option></select></div>
    </div>
    <label>Яркость</label>
    <input id="exposure" type="range" min="0.3" max="2.5" step="0.05" value="1" style="width:100%">
    <label>Фон</label>
    <select id="bg"><option value="dark">Тёмный (размытый)</option><option value="env">Студия (размытая)</option><option value="sky">Небо</option></select>
    <label>Материалы</label>
    <select id="mat"><option value="orig">Оригинал</option><option value="clay">Clay (без текстур)</option><option value="wire">Каркас</option><option value="normal">Нормали</option></select>
    <label>Инерция камеры</label><select id="inertia"><option value="0.12">Лёгкая</option><option value="0.05" selected>Плавная</option><option value="0.025">Тяжёлая (кино)</option></select>
    <label>Показывать</label>
    <div class="row"><button id="gridBtn" class="on">Сетка</button><button id="axesBtn">Оси</button><button id="rotBtn">Автовращение</button><button id="shadowBtn" class="on">Тени</button><button id="groundBtn" class="on">Земля</button></div>
    <label>Сохранённые камеры <span style="color:#888">(сначала «записать», затем слот)</span></label>
    <div class="row"><button id="saveCam" title="Записать текущий вид в слот"><i data-ic="save"></i></button><button class="slot" data-i="0">1</button><button class="slot" data-i="1">2</button><button class="slot" data-i="2">3</button></div>
  </div>

  <div id="animations" class="panel"><h3>Анимации</h3><div id="animationList"></div></div>

  <div id="paths" class="panel"><h3 style="margin:0 0 10px;font-size:14px">Пролёт камеры</h3>
    <div class="row"><button id="addKey"><i data-ic="plus"></i> Ключ</button><button id="pathPlay"><i data-ic="play"></i> Пролёт</button></div>
    <div id="keyList"></div>
    <label style="font-size:12px;color:#bbb;display:block;margin:8px 0 4px">Движение камеры</label>
    <select id="ease" style="width:100%"><option value="smooth">Плавный разгон и торможение</option><option value="cine">Кино: мягкая остановка на ключах</option><option value="linear">Равномерно</option></select>
    <div class="row" style="margin-top:8px"><button id="sync" class="on">С анимацией</button><button id="pathLoop">Повтор</button><button id="todKeys" class="on" title="Время суток меняется от ключа к ключу"><i data-ic="clock"></i> Время в ключах</button></div>
    <div class="row" style="margin-top:6px"><button id="rec"><i data-ic="rec"></i> Записать видео</button><button id="clearKeys" title="Удалить все ключи"><i data-ic="trash"></i></button></div>
    <div class="row" style="margin-top:6px"><button id="saveScene" title="Ключи, камеры и настройки вида → .cam.json"><i data-ic="save"></i> Сохранить сцену</button><button id="loadScene"><i data-ic="folder"></i> Загрузить</button></div>
    <input id="jsonIn" type="file" accept=".json">
  </div>
  </div>
  <button id="pillL" class="pill panel" title="Меню"><i data-ic="menu"></i></button>
  <button id="pillE" class="pill panel" title="Чистый экран (H)"><i data-ic="eye"></i></button>
  <button id="pillD" class="pill panel" title="Плеер"><i data-ic="film"></i></button>

  <div id="dock" class="panel">
    <button id="play"><i data-ic="pause"></i></button>
    <input id="timeline" type="range" min="0" max="1000" value="0">
    <span id="time">0.00 / 0.00</span>
    <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
    <button id="loop" class="on" title="Повтор"><i data-ic="repeat"></i></button><button id="hideD" title="Скрыть плеер"><i data-ic="close"></i></button>
  </div>

  <div id="status" class="panel">Модель не загружена</div>
  <div id="hint" class="panel">ЛКМ — вращение · Колесо — масштаб · ПКМ — панорама · двойной клик — фокус · H — чистый экран</div>
</div>
<div id="drop"><div class="dropbox panel"><div style="margin-bottom:8px"><i data-ic="cube" data-s="42"></i></div>Перетащи сюда <b>.GLB</b></div></div>

<script type="importmap">

</script>

    for (const k of ['tod', 'az', 'cloud']) if (d.view[k] != null) $(k).value = d.view[k];
    todVal = +$('tod').value; controls.dampingFactor = +$('inertia').value;
    if (d.view.ground != null) $('groundBtn').classList.toggle('on', d.view.ground);
    if (d.view.shadows != null) { $('shadowBtn').classList.toggle('on', d.view.shadows); setShadows(d.view.shadows); }
    if (d.view.exposure) { $('exposure').value = d.view.exposure; renderer.toneMappingExposure = d.view.exposure; }
    applyLight(); applyMaterials();
  }
  if (d.camera) { camera.position.copy(V(d.camera.p)); controls.target.copy(V(d.camera.t)); controls.update(); }
}
$('saveScene').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(collectScene(), null, 1)], { type: 'application/json' }));
  a.download = curName.replace(/\.(glb|gltf)$/i, '') + '.cam.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  setStatus('Сцена сохранена: ' + a.download);
};
$('loadScene').onclick = () => $('jsonIn').click();
$('jsonIn').onchange = async e => { await handleFiles([...e.target.files]); e.target.value = ''; };

// Двойной клик — сфокусироваться на точке модели
const ray = new THREE.Raycaster();
renderer.domElement.addEventListener('dblclick', e => {
  if (!model || pathT !== null) return;
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const hit = ray.intersectObject(model, true)[0];
  if (hit) flyTo(hit.point.clone().add(camera.position.clone().sub(controls.target)), hit.point.clone());
});

// Скрытие интерфейса
$('pillL').onclick = () => document.body.classList.toggle('noL');
$('pillE').onclick = () => document.body.classList.toggle('clean');
$('hideD').onclick = () => { document.body.classList.add('noD'); $('pillD').style.display = 'block'; };
$('pillD').onclick = () => { document.body.classList.remove('noD'); $('pillD').style.display = 'none'; };

// Drag & drop
let depth = 0;
addEventListener('dragenter', e => { e.preventDefault(); depth++; $('drop').classList.add('show'); });
addEventListener('dragleave', e => { e.preventDefault(); if (--depth <= 0) { depth = 0; $('drop').classList.remove('show'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => {
  e.preventDefault(); depth = 0; $('drop').classList.remove('show');
  handleFiles([...e.dataTransfer.files]);
});

function onResize() {
  const w = $('viewer').clientWidth || innerWidth, h = $('viewer').clientHeight || innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h); composer?.setSize(w, h);
}
addEventListener('resize', onResize);
new ResizeObserver(onResize).observe($('viewer'));
onResize();
addEventListener('keydown', e => {
  if (e.code === 'KeyH') document.body.classList.toggle('clean');
  if (e.code === 'Space' && action && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'SELECT') { e.preventDefault(); $('play').click(); }
});

const q = new URLSearchParams(location.search).get('model');
if (q) (async () => {
  try {
    const buf = await (await fetch(q)).arrayBuffer(); let data = null;
    try { const j = await fetch(q.replace(/\.(glb|gltf)$/i, '.cam.json')); if (j.ok) data = await j.json(); } catch {}
    loadBuffer(buf, q.split('/').pop(), data);
  } catch { setStatus('Не удалось открыть ' + q); }
})();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (mixer && playing) mixer.update(dt);
  if (action && !scrubbing) {
    const d = action.getClip().duration || 1;
    const t = action.time % d || (action.time >= d ? d : 0);
    $('timeline').value = (Math.min(t, d) / d) * 1000;
    $('time').textContent = `${fmt(Math.min(t, d))} / ${fmt(d)}`;
  }
  if (pathT !== null) {
    pathT += dt; const total = cum[cum.length - 1];
    if (pathT >= total) {
      if (on('pathLoop') && !recorder) { pathT -= total; syncAnim(); applyPath(pathT); }
      else { applyPath(total); stopPath(); }
    } else applyPath(pathT);
  }
  if (fly) {
    fly.k = Math.min(fly.k + dt / 1.4, 1);
    const s = fly.k ** 3 * (fly.k * (fly.k * 6 - 15) + 10);
    camera.position.lerpVectors(fly.p0, fly.p1, s);
    controls.target.lerpVectors(fly.t0, fly.t1, s);
    if (fly.k >= 1) fly = null;
  }
  if (on('timePlay') && isSun() && !(pathT !== null && on('todKeys'))) { todVal = (todVal + Math.min(dt, 0.1) * +$('timeSpeed').value) % 24; $('tod').value = todVal; updateSun(); }
  placeKey();
  skyRig.position.copy(camera.position); skyRig.scale.setScalar(camera.far * 0.9);
  cloudMat.uniforms.uTime.value = performance.now() / 1000;
  if (!fly && pathT === null) controls.panSpeed = THREE.MathUtils.clamp(modelSphere.radius * 0.1 / Math.max(camera.position.distanceTo(controls.target), 1e-6), 1, 40);
  controls.update();
  if (usePost) composer.render(dt); else renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
